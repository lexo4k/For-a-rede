services:
  - type: web
    name: wyncore
    runtime: node
    plan: starter
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /health
    disk:
      name: wyncore-data
      mountPath: /var/data
      sizeGB: 1
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATA_DIR
        value: /var/data
      - key: WYNCORE_OWNER_PASSWORD
        sync: false
      - key: WYNCORE_SESSION_SECRET
        generateValue: true
      - key: ASAAS_ENV
        value: sandbox
      - key: ASAAS_API_KEY
        sync: false
      - key: ASAAS_WEBHOOK_TOKEN
        sync: false
