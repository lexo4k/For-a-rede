name: GENESE Bounty Scanner
on:
  workflow_dispatch:
  schedule:
    - cron: "17 12 * * 1"
permissions:
  contents: read
jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Run unit tests
        working-directory: tools/genese-bounty-scan
        run: python -m unittest -v
      - name: Attempt live search and save report
        working-directory: tools/genese-bounty-scan
        run: python genese_bounty_scan.py --output scan-results.json
      - name: Upload report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: genese-bounty-scan-results
          path: tools/genese-bounty-scan/scan-results.json
          if-no-files-found: warn
          retention-days: 7
