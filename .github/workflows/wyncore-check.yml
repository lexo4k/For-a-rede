name: WYNCORE checks
on:
  push:
    branches: [wyncore-core, wyncore-platform-rebuild, wyncore-personal-work-hub]
    paths: ["wyncore/**", ".github/workflows/wyncore-check.yml"]
  pull_request:
    branches: [forcarede-init]
    paths: ["wyncore/**", ".github/workflows/wyncore-check.yml"]
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Check server syntax
        run: node --check wyncore/server.js
      - name: Check Ads frontend syntax
        run: node --check wyncore/ads.js
      - name: Check main frontend syntax
        run: node --check wyncore/app.js
      - name: Check service worker syntax
        run: node --check wyncore/sw.js
      - name: Check personal work hub syntax
        run: node --check wyncore/work.js
      - name: Verify personal work hub assets
        run: |
          test -s wyncore/work.html
          test -s wyncore/work.css
          test -s wyncore/work.js
      - name: WYNCORE Ads backend tests
        working-directory: wyncore
        run: node --test ads.test.js
      - name: Core backend tests
        working-directory: wyncore
        run: node --test domain.test.js server.test.js
      - name: Required files
        run: |
          test -s wyncore/index.html
          test -s wyncore/styles.css
          test -s wyncore/app.js
          test -s wyncore/README.md
          test -s wyncore/manifest.webmanifest
          test -s wyncore/server.js
          test -s wyncore/render.yaml
